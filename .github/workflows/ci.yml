name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: self-hosted
    env:
      # env.ts (zod) requires OPENAI_API_KEY to parse; unit tests don't call the API
      OPENAI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (nvm — self-hosted runner can't download from GitHub)
        run: |
          export NVM_DIR=$HOME/.nvm
          . $NVM_DIR/nvm.sh
          nvm use 20
          echo "$NVM_BIN" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm install

      - name: Build (web + server)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test (server)
        run: npm test

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Deploy to ubuntu-server
        run: |
          export NVM_DIR=$HOME/.nvm
          . $NVM_DIR/nvm.sh
          nvm use 20
          export PATH=$HOME/.npm-global/bin:$PATH
          which pm2 || npm install -g pm2
          DEPLOY_DIR="$HOME/supply-chain-agent"
          if [ ! -d "$DEPLOY_DIR" ]; then
            git clone git@github.com:PengYip/supply-chain-agent.git "$DEPLOY_DIR"
          fi
          cd "$DEPLOY_DIR"
          git fetch origin
          git reset --hard origin/main
          npm install
          npm run build
          EXPECTED_SHA="$(git rev-parse --short HEAD)"
          # Bake build info (read by /api/health at boot) AFTER build, BEFORE reload.
          printf '{"sha":"%s","builtAt":"%s"}\n' "$EXPECTED_SHA" "$(date -u +%FT%TZ)" > apps/server/dist/build-info.json
          pm2 reload sca-server || pm2 start ecosystem.config.cjs
          pm2 save
          # Self-verify: pm2 reload can silently no-op (esp. under concurrent
          # pushes), leaving a stale process on old code. Confirm the running
          # process serves the new SHA; force restart on mismatch; fail loudly.
          sleep 5
          verify_sha() {
            curl -fsS localhost:3001/api/health 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch(e){process.stdout.write("parse-error")}})' || true
          }
          RUNNING_SHA="$(verify_sha)"
          attempt=0
          while [ "$RUNNING_SHA" != "$EXPECTED_SHA" ] && [ "$attempt" -lt 3 ]; do
            attempt=$((attempt+1))
            echo "Running SHA '$RUNNING_SHA' != expected '$EXPECTED_SHA'; forcing pm2 restart (attempt $attempt)"
            pm2 restart sca-server
            sleep 5
            RUNNING_SHA="$(verify_sha)"
          done
          if [ "$RUNNING_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Deploy did not take effect: running '$RUNNING_SHA' != expected '$EXPECTED_SHA'" >&2
            exit 1
          fi
          echo "Deploy verified: server running SHA $RUNNING_SHA"

  # NOTE: Postgres integration tests (11) currently skip without DB_BACKEND=postgres.
  # To enable them, add a pgvector service container and set DB_BACKEND=postgres + DB_* creds.
